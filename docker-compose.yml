services:
  db:
    image: postgres:16
    container_name: sobrevivencia-abc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-survival_abc}
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting PostgreSQL}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyst} -d ${POSTGRES_DB:-survival_abc}"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 1gb

volumes:
  pgdata:
